<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17324d"><title>地籍圖定位查詢</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head><body>
<header><div><b>地籍圖定位查詢</b><small>地籍・紅線・黃線套疊與地號定位</small></div><button id="panelBtn">☰</button></header>
<main><aside id="panel">
<section><h3>1. 載入圖資</h3><label class="upload">地籍 SHP（ZIP）<input id="parcelFile" type="file" accept=".zip"></label><label class="upload red">紅線 SHP（ZIP）<input id="redFile" type="file" accept=".zip"></label><label class="upload yellow">黃線 SHP（ZIP）<input id="yellowFile" type="file" accept=".zip"></label><div id="loadStatus" class="hint">請將每組 .shp/.shx/.dbf/.prj 壓成一個 ZIP。</div></section>
<section id="fieldBox" class="disabled"><h3>2. 指定地籍欄位</h3><label>段名欄位<select id="sectionField"><option>請先載入地籍</option></select></label><label>地號欄位<select id="parcelField"><option>請先載入地籍</option></select></label><button id="applyFields" class="primary">套用欄位</button></section>
<section id="searchBox" class="disabled"><h3>3. 地號搜尋</h3><input id="keyword" placeholder="例如：524 或 山腳段 524"><button id="searchBtn" class="primary">搜尋並定位</button><div id="results"></div></section>
<section><h3>4. 圖層顯示</h3><div class="layer-switches"><label class="layer-check parcel"><input id="parcelToggle" type="checkbox" checked><span class="swatch"></span><span>地籍圖</span></label><label class="layer-check red"><input id="redToggle" type="checkbox" checked><span class="swatch"></span><span>紅線</span></label><label class="layer-check yellow"><input id="yellowToggle" type="checkbox" checked><span class="swatch"></span><span>黃線</span></label></div><div class="hint">三個圖層可獨立勾選，可只看其中一個、任兩個或全部顯示。</div><button id="fitAll">顯示已勾選圖資</button></section>
</aside><div id="map"></div></main>
<div id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/shpjs@6.1.0/dist/shp.js"></script><script src="app.js"></script></body></html>
