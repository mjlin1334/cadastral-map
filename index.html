<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17324d"><title>地籍圖定位查詢</title><link rel="manifest" href="manifest.json?v=18"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css?v=18"></head><body class="auth-locked">
<div id="authGate" class="auth-gate"><div class="auth-card"><div class="auth-brand">禾唐工程顧問有限公司</div><h1>地籍圖定位查詢系統</h1><p>本系統限授權使用者使用</p><form id="authForm"><label>授權碼<input id="authCode" type="password" autocomplete="one-time-code" placeholder="請輸入授權碼"></label><button class="primary" type="submit">登入</button></form><div id="authMsg" class="auth-msg"></div><div class="auth-copy">版權所有：禾唐工程顧問有限公司</div></div></div>
<header><div><b>地籍圖定位查詢</b><small>地籍・紅線・黃線套疊與地號定位</small></div><div class="header-actions"><button id="logoutBtn" title="登出">登出</button><button id="panelBtn">☰</button></div></header>
<main><aside id="panel">
<section><h3>1. 載入圖資</h3><label>DBF 中文編碼<select id="dbfEncoding"><option value="big5" selected>繁體中文 Big5 / CP950（建議）</option><option value="utf-8">UTF-8</option></select></label><div class="dataset-group parcel-group"><div class="dataset-title">地籍圖資</div><label class="upload">地籍 SHP（ZIP）<input id="parcelFile" type="file" accept=".zip"></label><label>地籍坐標系統<select id="parcelCrs"><option value="auto" selected>自動判斷 .prj（建議）</option><option value="3826">TWD97 / TM2 121°</option><option value="3828">TWD67 / TM2 121°</option><option value="3825">TWD97 / TM2 119°</option><option value="3827">TWD67 / TM2 119°</option><option value="4326">WGS84 經緯度</option></select></label></div><div class="dataset-group red-group"><div class="dataset-title">紅線圖資</div><label class="upload red">紅線 SHP（ZIP）<input id="redFile" type="file" accept=".zip"></label><label>紅線坐標系統<select id="redCrs"><option value="auto" selected>自動判斷 .prj（建議）</option><option value="3826">TWD97 / TM2 121°</option><option value="3828">TWD67 / TM2 121°</option><option value="3825">TWD97 / TM2 119°</option><option value="3827">TWD67 / TM2 119°</option><option value="4326">WGS84 經緯度</option></select></label></div><div class="dataset-group yellow-group"><div class="dataset-title">黃線圖資</div><label class="upload yellow">黃線 SHP（ZIP）<input id="yellowFile" type="file" accept=".zip"></label><label>黃線坐標系統<select id="yellowCrs"><option value="auto" selected>自動判斷 .prj（建議）</option><option value="3826">TWD97 / TM2 121°</option><option value="3828">TWD67 / TM2 121°</option><option value="3825">TWD97 / TM2 119°</option><option value="3827">TWD67 / TM2 119°</option><option value="4326">WGS84 經緯度</option></select></label></div><div id="loadStatus" class="hint">請將每組 .shp/.shx/.dbf/.prj 壓成一個 ZIP。</div></section>
<section id="fieldBox" class="disabled"><h3>2. 指定地籍欄位</h3><label>段名欄位<select id="sectionField"><option>請先載入地籍</option></select></label><label>地號欄位<select id="parcelField"><option>請先載入地籍</option></select></label><button id="applyFields" class="primary">套用欄位</button></section>
<section id="searchBox" class="disabled"><h3>3. 地號搜尋</h3><input id="keyword" placeholder="例如：524 或 山腳段 524"><button id="searchBtn" class="primary">搜尋並定位</button><div id="results"></div></section>
<section><h3>4. 圖層顯示</h3><div class="layer-switches"><label class="layer-check parcel"><input id="parcelToggle" type="checkbox" checked><span class="swatch"></span><span>地籍圖</span></label><label class="layer-check red"><input id="redToggle" type="checkbox" checked><span class="swatch"></span><span>紅線</span></label><label class="layer-check yellow"><input id="yellowToggle" type="checkbox" checked><span class="swatch"></span><span>黃線</span></label></div><div class="hint">三個圖層可獨立勾選，可只看其中一個、任兩個或全部顯示。</div><button id="fitAll">顯示已勾選圖資</button></section>
<section class="copyright"><strong>地籍圖定位查詢系統</strong><div>版權所有：禾唐工程顧問有限公司</div></section></aside><div id="map"></div></main>
<div id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/proj4@2.11.0/dist/proj4.js"></script><script src="https://cdn.jsdelivr.net/npm/shpjs@6.1.0/dist/shp.js"></script><script src="auth-config.js?v=18"></script><script src="auth.js?v=18"></script><script src="app.js?v=18"></script></body></html>
